<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="page-title">
    <h1>Online Admission Form</h1>
    <p>Neeche diya gaya form mukammal karein</p>
  </div>

  <main class="container" style="max-width:800px">
    <section>
      <div id="success" class="alert alert-success hidden"></div>
      <div id="error" class="alert alert-error hidden"></div>

      <form id="apply-form" class="card" novalidate>
        <h3 style="margin-bottom:16px">Personal Information</h3>
        <div class="row">
          <div class="field"><label>Poora Naam *</label><input name="name" required></div>
          <div class="field"><label>Walid ka Naam *</label><input name="father" required></div>
        </div>
        <div class="row">
          <div class="field"><label>CNIC / B-Form *</label><input name="cnic" placeholder="35202-1234567-1" required></div>
          <div class="field"><label>Date of Birth *</label><input type="date" name="dob" required></div>
        </div>
        <div class="row">
          <div class="field"><label>Gender *</label>
            <select name="gender" required><option value="">-- Chunein --</option><option>Male</option><option>Female</option></select>
          </div>
          <div class="field"><label>Phone *</label><input type="tel" name="phone" placeholder="03XX-XXXXXXX" required></div>
        </div>
        <div class="field"><label>Email</label><input type="email" name="email"></div>
        <div class="field"><label>Address *</label><textarea name="address" rows="2" required></textarea></div>

        <h3 style="margin:10px 0 16px">Academic Information</h3>
        <div class="row">
          <div class="field"><label>Course *</label><select name="course" id="course" required></select></div>
          <div class="field"><label>Pichli Degree *</label>
            <select name="lastDegree" required><option value="">-- Chunein --</option><option>Matric</option><option>Intermediate</option><option>Bachelor</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Obtained Marks *</label><input type="number" name="obtained" min="0" required></div>
          <div class="field"><label>Total Marks *</label><input type="number" name="total" min="1" required></div>
        </div>

        <button type="submit" class="btn btn-accent">Submit Application</button>
      </form>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const select = document.getElementById("course");
    const preselect = new URLSearchParams(location.search).get("course");
    const allCourses = getCourses();
    const cats = [...new Set([...CATEGORIES, ...allCourses.map(c => c.category || "Other Courses")])];
    select.innerHTML = '<option value="">-- Course chunein --</option>' + cats.map(cat => {
      const items = allCourses.filter(c => (c.category || "Other Courses") === cat);
      return items.length ? `<optgroup label="${escapeHtml(cat)}">${items.map(c =>
        `<option value="${escapeHtml(c.code)}" ${c.code === preselect ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}</optgroup>` : "";
    }).join("");

    const form = document.getElementById("apply-form");
    const success = document.getElementById("success");
    const error = document.getElementById("error");

    form.addEventListener("submit", e => {
      e.preventDefault();
      success.classList.add("hidden");
      error.classList.add("hidden");

      const data = Object.fromEntries(new FormData(form));
      const problems = [];
      [...form.querySelectorAll("[required]")].forEach(el => {
        if (!el.value.trim()) problems.push(el.closest(".field").querySelector("label").textContent.replace(" *", ""));
      });
      if (data.cnic && !/^\d{5}-?\d{7}-?\d$/.test(data.cnic)) problems.push("CNIC sahi format mein likhein");
      if (data.phone && !/^03\d{2}-?\d{7}$/.test(data.phone)) problems.push("Phone number sahi likhein (03XX-XXXXXXX)");
      if (Number(data.obtained) > Number(data.total)) problems.push("Obtained marks total se zyada nahi ho sakte");

      if (problems.length) {
        error.innerHTML = "<strong>Baraye meharbani yeh theek karein:</strong><br>" + problems.map(escapeHtml).join("<br>");
        error.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const apps = getApplications();
      const appId = "APP-" + new Date().getFullYear() + "-" + String(apps.length + 1).padStart(4, "0");
      data.id = appId;
      data.percentage = ((data.obtained / data.total) * 100).toFixed(1);
      data.submittedAt = new Date().toISOString();
      data.status = "Pending";
      apps.push(data);
      save("applications", apps);

      success.innerHTML = `✅ <strong>Shukriya ${escapeHtml(data.name)}!</strong> Aap ki application jama ho gayi hai.<br>
        Application ID: <strong>${appId}</strong> — isay sambhal kar rakhein.`;
      success.classList.remove("hidden");
      form.reset();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
